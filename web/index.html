<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>trackme</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 16px/1.5 system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
    }
    .card {
      background: #1e293b; padding: 2rem 2.5rem; border-radius: 12px;
      text-align: center; max-width: 28rem;
    }
    h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
    .sub { opacity: .7; margin: 0 0 1.5rem; font-size: .875rem; }
    .result { font-size: 3rem; font-weight: 700; margin: 1rem 0; }
    .err { color: #fca5a5; font-size: .875rem; }
    footer { opacity: .55; font-size: .75rem; margin-top: 1.5rem; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main class="card">
    <h1>trackme</h1>
    <p class="sub">suma servida por <code>GET /api/sum?a=2&amp;b=2</code></p>
    <p class="result" id="result">…</p>
    <p class="err" id="err" hidden>No he podido hablar con /api/sum (¿está el server corriendo?)</p>
    <footer><a href="/health">/health</a> · <a href="/docs/">/docs/</a></footer>
  </main>
  <script>
    // s3 en vivo: while the seeded bug is in `sum`, this card shows 0.
    fetch("/api/sum?a=2&b=2")
      .then((r) => r.json())
      .then((d) => { document.getElementById("result").textContent = d.result; })
      .catch(() => {
        document.getElementById("result").textContent = "—";
        document.getElementById("err").hidden = false;
      });
  </script>
</body>
</html>
