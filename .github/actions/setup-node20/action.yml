name: setup-node20
description: Pin Node 20 with npm cache and a clean install

inputs:
  cache-dependency-path:
    description: Path to the lockfile used for the npm cache key
    required: false
    default: package-lock.json

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: ${{inputs.cache-dependency-path}}
    - run: npm ci
      shell: bash
