name: "CD: imagen + web"

on:
  push:
    branches: [main]

permissions: {}

jobs:
  imagen:
    runs-on: ubuntu-22.04
    permissions: 
     contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
      
