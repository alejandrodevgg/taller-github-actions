name: CI trackme

on:
  push:
    branches: [main]
    paths-ignore: [docs/**]
  pull_request:
    branches: [main]
    paths-ignore: [docs/**]

permissions:
 contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
            node-version: 22
            cache: npm
      - run: npm ci
      - run: npm test
  informe:
    needs: [lint,test]
    runs-on: ubuntu-22.04
    steps:
      - name: Build summary
        run: |
          echo "Todo funcionando !!"
          echo " evento ${{github.event_name}}, actor ${{github.actor}}"
    
    
