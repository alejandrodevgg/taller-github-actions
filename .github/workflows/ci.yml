name: CI trackme

on:
  push:
    branches: [main]
    paths-ignore: [docs/**]
  pull_request:
    branches: [main]
    paths-ignore: [docs/**]

permissions:
 contents: read

defaults:
  run:
    shell: bash

jobs:
  ci-trackme:
    uses: ./.github/workflows/ci-reusable.yml
    with:
      node: 22
      app-path: "."
    secrets: inherit
  informe:
    needs: ci-trackme
    runs-on: ubuntu-22.04
    steps:
      - name: Build summary
        run: |
          echo "Todo funcionando !!"
          echo " evento ${{github.event_name}}, actor ${{github.actor}}"
    
    
