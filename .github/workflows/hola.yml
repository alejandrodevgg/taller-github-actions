name: hola runner

on:
  workflow_dispatch:
    inputs:
      mensaje:
        description: "Saludo"
        type: string
        default: "hola desde el runner"
        required: true

permissions:
  contents: read

jobs:
  saludo:
    runs-on: ubuntu-22.04
    steps:
      - name: Echo the dispatch inputs
        env:
          MENSAJE: ${{ inputs.mensaje }}
        run: |
          echo "mensaje: $MENSAJE"
      - name: Contexto Github
        run: |
          echo "actor: ${{github.actor}}"
          echo "repo: ${{github.repository}}"
          echo "evento: ${{github.event_name}}"
      - name: Que hay en la maquina
        run: |
          ls -la

      - uses: actions/checkout@v4
      
      - name: usando un addon
        run: ls -la
